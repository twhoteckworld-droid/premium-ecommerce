<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NovaStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-page { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: #f7f9fc; }
        .auth-card { width: 100%; max-width: 420px; background: #fff; border-radius: 16px; padding: 36px 28px; box-shadow: 0 10px 40px rgba(7, 26, 53, 0.08); }
        .auth-card h1 { font-size: 24px; color: var(--navy); margin-bottom: 8px; text-align: center; }
        .auth-card p { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 24px; }
        .auth-form label { display: block; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; margin-top: 14px; }
        .auth-form input { width: 100%; padding: 12px 14px; border: 1px solid #dce3ed; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; transition: 0.2s; }
        .auth-form input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.1); }
        .auth-form button { width: 100%; padding: 14px; background: var(--blue); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        .auth-form button:hover:not(:disabled) { background: #0b50b8; transform: translateY(-1px); }
        .auth-form button:disabled { opacity: 0.6; cursor: not-allowed; }
        .auth-error { background: #fef2f2; color: #dc2626; padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; display: none; }
        .auth-error.show { display: block; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
        .auth-footer a { color: var(--blue); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <a href="/" class="logo">NOVA<span>STORE.</span></a>
        </div>
    </header>

    <div class="auth-page">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p>Login to your NovaStore account</p>

            <div class="auth-error" id="authError"></div>

            <form class="auth-form" id="loginForm">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com" required autofocus>

                <label>Password</label>
                <input type="password" id="password" placeholder="Your password" required>

                <button type="submit" id="loginBtn">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register.html">Register</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('authError');
            error.classList.remove('show');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message);

                localStorage.setItem('novaCustomerToken', data.token);
                localStorage.setItem('novaCustomerUser', JSON.stringify(data.user));
                window.location.href = '/account.html';
            } catch (err) {
                error.textContent = err.message;
                error.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
